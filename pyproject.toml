[project]
name = "repo-surgeon"
version = "0.1.0"
description = "Mutation-gated codebase migration: it refuses the changes it cannot prove"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["codemod", "migration", "mutation-testing", "differential-testing", "llm", "refactoring"]
# No runtime dependencies. The model is reached over plain HTTP with urllib, the analysis
# is stdlib `ast`, and the verification is stdlib `subprocess`. A tool whose whole claim is
# "it proves things" should not ask you to trust a dependency tree to believe it.
dependencies = []

[project.optional-dependencies]
suite = ["pytest>=8"]   # only needed for rung 5, against the TARGET repo

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[project.scripts]
repo-surgeon = "repo_surgeon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_surgeon"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
